# Copyright © akenejie
# SPDX-License-Identifier: AGPL-3.0-only
#
# Control protocol for the 2-thread backends: the shared control table
# (`PublishedControls`) a UI thread hit-tests against, the tagged property
# value (`ControlPropertyValue` / `CSlintControlPropertyValue`) and the C ABI
# property-access seam (`ComponentPropertyAccess`).  Also the geometry-only
# item-tree walk (`controls::encode_window_controls`) that publishes control
# geometry without drawing anything — drawing stays with the upstream renderer
# on the render thread.

[package]
name = "i-slint-backend-scene"
description = "Control protocol types and geometry-only encoder for the 2-thread backends"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std", "image-decoders", "svg"]
std = ["i-slint-core/std"]
image-decoders = ["i-slint-core/image-decoders"]
svg = ["i-slint-core/svg"]

[dependencies]
i-slint-core = { workspace = true, features = ["default", "box-shadow-cache"] }
lyon_path = { workspace = true }

[dev-dependencies]
# A headless window to encode, and a way to build a component with real widgets
# in it. Both only exist to check that the geometry-only encode agrees with the
# full one.
i-slint-backend-testing = { path = "../testing" }
i-slint-compiler = { path = "../../compiler" }
slint-interpreter = { path = "../../interpreter", features = ["internal"] }
spin_on = { workspace = true }
